# Local weather app — run on your home network
#   docker compose up -d --build
#   open http://localhost:8000
# v2 (Rust): same service, container, port and volume as v1, so an upgrade
# keeps the data (see docs/MIGRATION.md).
services:
  weather:
    build:
      context: .
      dockerfile: rust/Dockerfile
    container_name: weather-app
    ports:
      - "${PORT:-8000}:8000"   # another host port: PORT=9000 docker compose up -d
    # weather.yaml is baked into the image: rebuild after changing it.
    environment:
      DATABASE_PATH: /data/weather.db
      # ALLOWED_HOSTS: "pi.fritz.box"   # extra host names; IPs, localhost and *.local always work
      # USE_ACCURACY_WEIGHTS: "true"    # weight the models by their accuracy (after ~2 days)
    volumes:
      - weather-data:/data
    restart: always
    # Non-root (uid 1000), read-only root filesystem; only /data and /tmp are writable.
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 200

volumes:
  weather-data:
