# Local weather app — run on your home network
#   docker compose up -d --build
#   open http://localhost:8000
services:
  weather:
    build: .
    container_name: weather-app
    ports:
      - "${PORT:-8000}:8000"
    # All runtime config (location, radius, weights, models, cadence) lives in
    # weather.yaml at the repo root and is baked into the image. Rebuild (or
    # re-run `docker compose up -d --build`) after changing it.
    # Optional: to override the published host port without editing the file,
    # run:  PORT=9000 docker compose up -d
    environment:
      DATABASE_PATH: /data/weather.db
      # ALLOWED_HOSTS: "pi.fritz.box"   # extra host names (router DNS); IPs, localhost and *.local always work
    volumes:
      - weather-data:/data
    # The app schedules its own refreshes (radar 5 min, models hourly);
    # keep the container alive and restart it on crash/host reboot.
    restart: always
    # No privileged access needed; these are read-only public APIs.
    # Hardened (step 7d): the image runs as the non-root `app` user
    # (uid 1000) on a read-only root filesystem. Only /data (volume) and
    # /tmp (tmpfs) are writable; all capabilities are dropped, no new
    # privileges can be gained, and the process count is bounded. The
    # /tmp tmpfs is bounded at 16 MB with noexec/nosuid/nodev.
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 200

volumes:
  weather-data:

