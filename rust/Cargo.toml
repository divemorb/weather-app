[package]
name = "wetter"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT"
description = "Local weather aggregation service (Rust port of the Python backend)"

# Exact pins, approved in the architecture plan (2026-09-30). Protected file:
# only a step that lists it may change it, and the watchdog pauses for a
# review afterwards.
[dependencies]
axum = "=0.8.9"
tokio = { version = "=1.53.1", features = ["rt", "macros", "time", "signal", "net", "sync"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "gzip", "query"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde-saphyr = "=1.3.0"
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"] }
chrono-tz = "=0.10.4"
base64 = "=0.23.1"
flate2 = "=1.1.10"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
tempfile = "=3.27.0"

[profile.release]
strip = true
lto = "thin"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
