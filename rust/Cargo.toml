[package]
name = "wetter"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT"
description = "Local weather aggregation service (Rust port of the Python backend)"

# Exact pins, approved in the architecture plan (2026-09-30). Protected file:
# only a step that lists it may change it, and the watchdog pauses for a
# review afterwards.
[dependencies]
axum = "=0.8.9"
tokio = { version = "=1.53.1", features = ["rt", "macros", "time", "signal", "net", "sync"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "gzip", "query"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
serde-saphyr = "=1.3.0"
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"] }
chrono-tz = "=0.10.4"
base64 = "=0.23.1"
flate2 = "=1.1.10"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
tempfile = "=3.27.0"

[profile.release]
strip = true
lto = "thin"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# the curated strict lints (pedantic/nursery picks, the user's choice 2026-10-14)
assert_is_empty = "deny"
case_sensitive_file_extension_comparisons = "deny"
cast_lossless = "deny"
cast_precision_loss = "deny"
cognitive_complexity = "deny"
collection_is_never_read = "deny"
derive_partial_eq_without_eq = "deny"
fn_params_excessive_bools = "deny"
implicit_clone = "deny"
items_after_statements = "deny"
iter_on_single_items = "deny"
large_stack_arrays = "deny"
manual_let_else = "deny"
match_same_arms = "deny"
match_wildcard_for_single_variants = "deny"
needless_pass_by_value = "deny"
needless_raw_string_hashes = "deny"
option_option = "deny"
redundant_clone = "deny"
redundant_closure_for_method_calls = "deny"
string_lit_as_bytes = "deny"
struct_excessive_bools = "deny"
too_many_lines = "deny"
trivially_copy_pass_by_ref = "deny"
unnecessary_debug_formatting = "deny"
unreadable_literal = "deny"
use_self = "deny"
