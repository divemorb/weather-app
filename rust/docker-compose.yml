# Rust backend (port in progress; the Python app in the repo root is still
# the deployed version). From the repo root:
#   podman compose -f rust/docker-compose.yml up -d --build --force-recreate
# On a machine that doesn't build (Raspberry Pi), load the image first
# (podman save | ssh … podman load) and start it without --build.
services:
  weather:
    image: localhost/wetter-rust:latest
    build:
      context: ..
      dockerfile: rust/Dockerfile
    container_name: weather-app-rust
    ports:
      - "${PORT:-8000}:8000"
    environment:
      DATABASE_PATH: /data/weather.db
      # ALLOWED_HOSTS: "pi.fritz.box"   # extra host names (router DNS); IPs, localhost and *.local always work
    volumes:
      - weather-data:/data
    restart: always
    # Same hardening as the Python app: non-root (uid 1000), read-only root
    # filesystem, only /data (volume) and /tmp (small tmpfs) writable, all
    # capabilities dropped, no privilege gain, bounded process count.
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 200

volumes:
  weather-data:
    # Takes over the Python app's data as is (same schema, same uid 1000).
    # Compose names that volume <project>_weather-data, the project being the
    # directory of the Python compose file (a checkout named "wetter" by
    # default); set WETTER_VOLUME if yours is named differently.
    name: ${WETTER_VOLUME:-wetter_weather-data}
