<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Local Rain Forecast</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/chart.css" />
  <link rel="stylesheet" href="/details.css" />
  <link rel="stylesheet" href="/kiosk.css" />
  <link rel="stylesheet" href="/layout.css" />
  <link rel="stylesheet" href="/sky.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 6C32 6 12 30 12 42a20 20 0 0 0 40 0C52 30 32 6 32 6Z' fill='%2358a6ff'/%3E%3C/svg%3E" />
</head>
<body>
  <!-- The animated sky (step A3): one fixed layer behind the tiles,
       showing the current scene. app.js names it on <html data-scene>
       from the /api/now icon and the radar; sky.js fills the particle
       containers. Decoration: hidden from screen readers. -->
  <div class="sky" id="sky" data-test="sky" aria-hidden="true">
    <div class="sky-stars" id="sky-stars"></div>
    <div class="sky-moon"></div>
    <div class="sky-sun"><div class="sky-rays"></div><div class="sky-core"></div></div>
    <div class="sky-clouds">
      <div class="cloud c1"></div>
      <div class="cloud c2"></div>
      <div class="cloud c3"></div>
      <div class="cloud c4"></div>
      <div class="cloud c5"></div>
    </div>
    <div class="sky-fog">
      <div class="fog-band f1"></div>
      <div class="fog-band f2"></div>
      <div class="fog-band f3"></div>
    </div>
    <div class="sky-streaks" id="sky-streaks"></div>
    <div class="sky-rain" id="sky-rain"></div>
    <div class="sky-snow" id="sky-snow"></div>
    <div class="sky-hail" id="sky-hail"></div>
    <div class="sky-lightning"><div class="sky-bolt"></div></div>
  </div>
  <div class="wrap">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M10.5 21.5a6 6 0 0 1-1.2-11.9 8 8 0 0 1 15.5 2.2 5.5 5.5 0 0 1-1.3 10.9l-13-.2Z" />
          <path stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M11.5 25l-1.3 3.4M17.5 25l-1.3 3.4M23.5 25l-1.3 3.4" />
        </svg>
        <div class="brand-text">
          <span class="place" id="location" data-test="location"></span>
          <p class="place-detail muted" id="location-detail" data-test="location-detail"></p>
        </div>
      </div>
      <div class="actions">
        <button id="location-btn" data-test="location-button" class="btn" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 4.9 5.2 10.9 6.4 12.3a1 1 0 0 0 1.2 0C13.8 19.9 19 13.9 19 9a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 14.5 9 2.5 2.5 0 0 1 12 11.5Z" />
          </svg>
        </button>
        <button id="theme-toggle" data-test="theme-toggle" class="btn" type="button">
          <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="4.5" fill="currentColor" />
            <path stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  d="M12 2v3M12 19v3M2 12h3M19 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M19.4 4.6l-2.1 2.1M6.7 17.3l-2.1 2.1" />
          </svg>
          <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M20.5 14.6A8.7 8.7 0 0 1 9.4 3.5a8.7 8.7 0 1 0 11.1 11.1Z" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Setup wizard: shown until a location is saved. Its texts live in
         i18n.js; setup.js fills the empty elements. -->
    <section class="card setup" id="setup" data-test="setup" hidden>
      <div class="card-head"><h2 id="setup-title"></h2></div>
      <p class="muted setup-intro" id="setup-intro"></p>

      <div class="setup-block">
        <label class="setup-label" for="setup-search" id="setup-search-label"></label>
        <div class="setup-search-row">
          <input id="setup-search" data-test="setup-search" type="text" autocomplete="off" spellcheck="false" />
          <button id="setup-search-btn" data-test="setup-search-button" class="btn btn-wide" type="button"></button>
        </div>
        <ul class="setup-results" id="setup-results" hidden></ul>
      </div>

      <div class="setup-divider" aria-hidden="true"><span id="setup-divider"></span></div>

      <div class="setup-block">
        <div class="setup-coords">
          <div>
            <label class="setup-label" for="setup-lat" id="setup-lat-label"></label>
            <input id="setup-lat" data-test="setup-lat" type="text" inputmode="decimal" autocomplete="off" />
          </div>
          <div>
            <label class="setup-label" for="setup-lon" id="setup-lon-label"></label>
            <input id="setup-lon" data-test="setup-lon" type="text" inputmode="decimal" autocomplete="off" />
          </div>
        </div>
        <label class="setup-label" for="setup-tz" id="setup-tz-label"></label>
        <input id="setup-tz" data-test="setup-tz" type="text" autocomplete="off" spellcheck="false" />
      </div>

      <div class="setup-actions">
        <button id="setup-save" data-test="setup-save" class="btn btn-wide btn-primary" type="button"></button>
        <button id="setup-cancel" data-test="setup-cancel" class="btn btn-wide" type="button" hidden></button>
      </div>

      <p class="setup-status" id="setup-status" data-test="setup-status" aria-live="polite"></p>

      <p class="setup-note muted" id="setup-note"></p>
    </section>

    <!-- Data: the glance first; Now, chart and details follow -->
    <main id="dashboard">
      <section class="card glance" id="glance">
        <h1 class="glance-answer" id="rain-answer" data-test="rain-answer"></h1>
        <p class="glance-when" id="rain-when" data-test="rain-when" hidden></p>
        <div class="glance-prob">
          <span class="glance-prob-value" id="rain-probability" data-test="rain-probability"></span>
          <span class="glance-prob-label muted" id="glance-prob-label"></span>
        </div>
        <div class="radar">
          <p class="radar-unavailable" id="radar-unavailable" data-test="radar-unavailable" hidden></p>
          <div class="radar-visual" id="radar-visual" hidden>
            <div class="radar-top">
              <span class="radar-max" id="radar-max" data-test="radar-max" hidden></span>
              <p class="radar-dry" id="radar-dry" data-test="radar-dry" hidden></p>
            </div>
            <div class="radar-strip" id="radar-strip" role="img"></div>
            <div class="radar-labels" id="radar-labels" aria-hidden="true"></div>
            <p class="radar-caption" id="radar-caption" data-test="radar-caption" hidden></p>
          </div>
        </div>
      </section>

      <!-- Now: current conditions, temperature and condition big -->
      <section class="card now" id="now">
        <h2 class="now-title" id="now-title"></h2>
        <p class="now-unavailable" id="now-unavailable" data-test="now-unavailable" hidden></p>
        <div class="now-body" id="now-body">
          <div class="now-main">
            <span class="now-temp" id="now-temp" data-test="now-temp"></span>
            <span class="now-condition" id="now-condition" data-test="now-condition"></span>
          </div>
          <dl class="now-grid">
            <div class="now-cell">
              <dt class="now-label" id="now-feels-label"></dt>
              <dd class="now-value" id="now-feels" data-test="now-feels"></dd>
            </div>
            <div class="now-cell">
              <dt class="now-label" id="now-wind-label"></dt>
              <dd class="now-value" id="now-wind" data-test="now-wind"></dd>
            </div>
            <div class="now-cell">
              <dt class="now-label" id="now-gusts-label"></dt>
              <dd class="now-value" id="now-gust" data-test="now-gust"></dd>
            </div>
            <div class="now-cell">
              <dt class="now-label" id="now-humidity-label"></dt>
              <dd class="now-value" id="now-humidity" data-test="now-humidity"></dd>
            </div>
            <div class="now-cell">
              <dt class="now-label" id="now-pressure-label"></dt>
              <dd class="now-value" id="now-pressure" data-test="now-pressure"></dd>
            </div>
            <div class="now-cell">
              <dt class="now-label" id="now-dewpoint-label"></dt>
              <dd class="now-value" id="now-dewpoint" data-test="now-dewpoint"></dd>
            </div>
            <div class="now-cell">
              <dt class="now-label" id="now-clouds-label"></dt>
              <dd class="now-value" id="now-clouds" data-test="now-clouds"></dd>
            </div>
            <div class="now-cell">
              <dt class="now-label" id="now-rain-label"></dt>
              <dd class="now-value" id="now-rain" data-test="now-rain"></dd>
            </div>
          </dl>
          <p class="now-time muted" id="now-time" data-test="now-time"></p>
          <!-- Who measured "Now" — hidden when /api/now has no station -->
          <p class="now-station muted" id="now-station" data-test="now-station" hidden></p>
        </div>
      </section>

      <!-- Next 24 hours: the models' precipitation as inline SVG;
           without data the status lines take the plot's place -->
      <section class="card chart" id="chart-card">
        <div class="chart-head">
          <h2 class="chart-title" id="chart-title"></h2>
          <span class="chart-unit" id="chart-unit" data-test="chart-unit" hidden></span>
        </div>
        <p class="chart-status" id="chart-unavailable" data-test="chart-unavailable" hidden></p>
        <p class="chart-status" id="chart-dry" data-test="chart-dry" hidden></p>
        <div class="chart-body" id="chart-body"></div>
        <ul class="chart-legend" id="chart-legend" hidden></ul>
      </section>

      <!-- Details: the technical parts, collapsed on load; details.js
           fills #details-body from /api/rain-probability, /api/sources,
           /api/schedule and /api/model-accuracy -->
      <details class="card details" id="details" data-test="details">
        <summary id="details-summary"><span class="details-title" id="details-title"></span></summary>
        <div class="details-body" id="details-body"></div>
      </details>
    </main>

    <footer class="attr" id="attribution" data-test="attribution"></footer>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
