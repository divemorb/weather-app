[pytest]
# -p no:cacheprovider: the image runs as the non-root `app` user, which
# cannot write .pytest_cache into the mounted repo (read-only from its view)
addopts = -p no:cacheprovider
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
